<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAC Payback Period Calculator — SaaS Metrics Tool</title>
    <meta name="description" content="Calculate Customer Acquisition Cost (CAC) payback period to measure how fast your SaaS recovers marketing and sales expenses.">
    <link rel="canonical" href="https://SHARADEX.github.io/zero-cost-ai-business-c/calculators/cac-payback-calculator.html">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../calculators/">Calculators</a>
            <a href="../converters/">Converters</a>
            <a href="../blog/">Blog</a>
        </nav>
    </header>
    <main>
        <h1>CAC Payback Period Calculator</h1>
        <p class="subtitle">Determine the number of months required to earn back your customer acquisition cost.</p>
        <div class="calculator-box">
            <label for="cac">Customer Acquisition Cost (CAC) ($):</label>
            <input type="number" id="cac" value="500">
            
            <label for="arpu">Average Revenue Per User (ARPU) ($/month):</label>
            <input type="number" id="arpu" value="100">
            
            <label for="margin">Gross Margin (%):</label>
            <input type="number" id="margin" value="80">
            
            <button onclick="calculatePayback()">Calculate Payback</button>
            
            <div id="result" class="result">
                <h3>Payback Period: <span id="paybackOutput">--</span> months</h3>
            </div>
        </div>
        <script>
            function calculatePayback() {
                const cac = parseFloat(document.getElementById('cac').value) || 0;
                const arpu = parseFloat(document.getElementById('arpu').value) || 0;
                const margin = (parseFloat(document.getElementById('margin').value) || 0) / 100;
                
                const monthlyContribution = arpu * margin;
                if (monthlyContribution <= 0) {
                    document.getElementById('paybackOutput').innerText = 'Invalid input';
                    return;
                }
                const payback = cac / monthlyContribution;
                document.getElementById('paybackOutput').innerText = payback.toFixed(1);
            }
        </script>
    </main>
