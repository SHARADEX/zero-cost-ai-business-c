    <main>
        <h1>Net Salary Calculator</h1>
        <p class="subtitle">Estimate your actual take-home pay after taxes and deductions.</p>
        <div class="calculator-box">
            <label for="gross">Gross Annual Salary ($):</label>
            <input type="number" id="gross" value="75000">
            <label for="taxrate">Estimated Tax Rate (%):</label>
            <input type="number" id="taxrate" value="25">
            <button onclick="calculate()">Calculate Take-Home</button>
            <div id="result" class="result-box" style="margin-top:20px; font-weight:bold;"></div>
        </div>
        <script>
        function calculate() {
            const gross = parseFloat(document.getElementById('gross').value) || 0;
            const taxrate = parseFloat(document.getElementById('taxrate').value) || 0;
            const annualTax = gross * (taxrate / 100);
            const netAnnual = gross - annualTax;
            const netMonthly = netAnnual / 12;
            document.getElementById('result').innerText = `Annual Net Pay: $${netAnnual.toFixed(2)} | Monthly Take-Home: $${netMonthly.toFixed(2)}`;
        }
        calculate();
        </script>
