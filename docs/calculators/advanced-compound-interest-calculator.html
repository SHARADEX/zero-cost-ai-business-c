        <h1>Advanced Compound Interest Calculator</h1>
        <p>Plan your financial future by projecting how your investments can grow with compound interest.</p>
        
        <div class="calculator-box">
            <label>Initial Principal ($): <input type="number" id="principal" value="10000"></label>
            <label>Annual Interest Rate (%): <input type="number" id="rate" value="7"></label>
            <label>Years to Grow: <input type="number" id="years" value="10"></label>
            <label>Monthly Contribution ($): <input type="number" id="contribution" value="500"></label>
            <button onclick="calculateCompound()">Calculate Growth</button>
            <div id="result" style="margin-top: 20px; font-weight: bold;"></div>
        </div>

        <script>
        function calculateCompound() {
            let P = parseFloat(document.getElementById('principal').value);
            let r = parseFloat(document.getElementById('rate').value) / 100;
            let t = parseFloat(document.getElementById('years').value);
            let PMT = parseFloat(document.getElementById('contribution').value);
            let n = 12;
            
            let total = P * Math.pow(1 + r/n, n*t);
            for(let i = 1; i <= t*n; i++) {
                total += PMT * Math.pow(1 + r/n, (t*n - i));
            }
            document.getElementById('result').innerText = 'Future Value: $' + total.toFixed(2);
        }
        </script>
