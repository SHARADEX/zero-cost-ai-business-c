<!DOCTYPE html>
<html lang=""en"">
<head>
    <meta charset=""UTF-8"">
    <meta name=""viewport"" content=""width=device-width, initial-scale=1.0"">
    <title>CAC Payback Period Calculator — SaaS & Startup Metrics</title>
    <meta name=""description"" content=""Calculate your Customer Acquisition Cost (CAC) payback period in months. Essential SaaS metric calculator for founders and growth teams."">
    <link rel=""stylesheet"" href=""../assets/style.css"">
    <link rel=""canonical"" href=""https://SHARADEX.github.io/zero-cost-ai-business-c/calculators/cac-payback-period-calculator.html"">
</head>
<body>
    <header>
        <nav>
            <a href=""../index.html"">Home</a>
            <a href=""../calculators/"">Calculators</a>
            <a href=""../converters/"">Converters</a>
            <a href=""../tools/"">Tools</a>
        </nav>
    </header>
    <main>
        <h1>CAC Payback Period Calculator</h1>
        <p>Determine how many months it takes for a customer to repay the cost of acquiring them.</p>
        
        <div class=""calculator-box"">
            <label for=""cac"">Customer Acquisition Cost (CAC) ($):</label>
            <input type=""number"" id=""cac"" value=""500"">
            
            <label for=""arpu"">Average Revenue Per User (Monthly) ($):</label>
            <input type=""number"" id=""arpu"" value=""100"">
            
            <label for=""margin"">Gross Margin (%):</label>
            <input type=""number"" id=""margin"" value=""80"">
            
            <button onclick=""calculatePayback()"">Calculate Payback</button>
            
            <div id=""result"" style=""margin-top: 20px; font-weight: bold;""></div>
        </div>

        <script>
            function calculatePayback() {
                const cac = parseFloat(document.getElementById('cac').value);
                const arpu = parseFloat(document.getElementById('arpu').value);
                const margin = parseFloat(document.getElementById('margin').value) / 100;
                
                if (arpu * margin <= 0) {
                    document.getElementById('result').innerText = 'Invalid inputs: Gross profit per user must be greater than zero.';
                    return;
                }
                
                const months = cac / (arpu * margin);
                document.getElementById('result').innerText = 'CAC Payback Period: ' + months.toFixed(1) + ' months';
            }
        </script>
    </main>
    <footer>
        <p>&copy; 2026 Free Business Tools. All rights reserved.</p>
    </footer>
</body>
</html>
