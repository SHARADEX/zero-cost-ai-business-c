name: Health Check (v4)

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site health
        run: |
          python3 -c "
          import os, sys, json, urllib.request, urllib.error
          from datetime import datetime, timezone

          base_url = os.environ.get('SITE_BASE_URL', '').rstrip('/')
          if not base_url or 'testuser' in base_url:
              print('SITE_BASE_URL not configured — skipping health check')
              sys.exit(0)

          issues = []

          # 1. Check that the site responds
          try:
              req = urllib.request.Request(base_url, method='HEAD',
                  headers={'User-Agent': 'ZeroCostAI-HealthCheck/4.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  if r.status != 200:
                      issues.append(f'Site returned HTTP {r.status} (expected 200)')
          except Exception as e:
              issues.append(f'Site unreachable: {e}')

          # 2. Check that sitemap.xml is reachable
          try:
              req = urllib.request.Request(f'{base_url}/sitemap.xml', method='HEAD',
                  headers={'User-Agent': 'ZeroCostAI-HealthCheck/4.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  if r.status != 200:
                      issues.append(f'sitemap.xml returned HTTP {r.status}')
          except Exception as e:
              issues.append(f'sitemap.xml unreachable: {e}')

          # 3. Check that robots.txt is reachable
          try:
              req = urllib.request.Request(f'{base_url}/robots.txt', method='HEAD',
                  headers={'User-Agent': 'ZeroCostAI-HealthCheck/4.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  if r.status != 200:
                      issues.append(f'robots.txt returned HTTP {r.status}')
          except Exception as e:
              issues.append(f'robots.txt unreachable: {e}')

          # 4. Check that at least one tool page is reachable
          try:
              req = urllib.request.Request(f'{base_url}/tools/json-formatter.html', method='HEAD',
                  headers={'User-Agent': 'ZeroCostAI-HealthCheck/4.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  if r.status != 200:
                      issues.append(f'tools/json-formatter.html returned HTTP {r.status}')
          except Exception as e:
              issues.append(f'tools/json-formatter.html unreachable: {e}')

          if issues:
              print('HEALTH ISSUES FOUND:')
              for i in issues:
                  print(f'  - {i}')
              # Write to GITHUB_ENV for issue creation
              report = '# Health Check Failed\\n\\nDetected at: ' + datetime.now(timezone.utc).isoformat() + '\\n\\n'
              report += '## Issues\\n\\n'
              for i in issues:
                  report += f'- {i}\\n'
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'HEALTH_REPORT<<EOF\\n{report}\\nEOF\\n')
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('HEALTH_STATUS=failed\\n')
          else:
              print('All health checks passed.')
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('HEALTH_STATUS=ok\\n')
          "
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}

      - name: Create issue if unhealthy
        if: env.HEALTH_STATUS == 'failed'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const report = process.env.HEALTH_REPORT || '(no report)';
            const date = new Date().toISOString().slice(0, 10);
            // Check if there's an open issue with the same label
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check-failed'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Health Check Failed — ${date}`,
                body: report,
                labels: ['health-check-failed', 'urgent']
              });
            } else {
              // Update the existing issue with a comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Update ${date}: still failing.\n\n${report}`
              });
            }
        env:
          HEALTH_REPORT: ${{ env.HEALTH_REPORT }}

      - name: Close issues if healthy now
        if: env.HEALTH_STATUS == 'ok'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check-failed'
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Site is healthy again. Closing this issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
