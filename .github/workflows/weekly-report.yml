name: Weekly Report (v4)

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate weekly report
        run: |
          python3 -c "
          import os, json
          from datetime import datetime, timezone, timedelta

          # Read state files
          def read(path, default=''):
              try:
                  with open(path, 'r') as f: return f.read()
              except: return default

          state = read('memory/state.md', '(empty)')
          revenue = read('memory/revenue.md', '(empty)')
          experiments = read('memory/experiments.md', '(empty)')
          analytics = read('memory/analytics.md', '(empty)')
          distribution = read('memory/distribution_log.md', '(empty)')
          action_log = read('memory/action_log.md', '(empty)')

          # Read budget JSON
          try:
              with open('memory/budget.json') as f:
                  budget = json.load(f)
              budget_summary = f\"\"\"
          Budget this week:
          - Date tracked: {budget.get('date', '?')}
          - Providers used:
          \"\"\"
              for p, u in budget.get('providers', {}).items():
                  if u.get('requests_used', 0) > 0 or u.get('tokens_used', 0) > 0:
                      budget_summary += f'    - {p}: {u.get(\"requests_used\", 0)} requests, {u.get(\"tokens_used\", 0)} tokens\\n'
          except: budget_summary = '(budget.json not found)'

          # Read revenue ledger
          try:
              with open('memory/revenue_ledger.json') as f:
                  ledger = json.load(f)
              txs = ledger.get('transactions', [])
              revenue_summary = f'Revenue transactions logged: {len(txs)}\\n'
              for tx in txs[-5:]:
                  revenue_summary += f'  - {tx.get(\"timestamp\", \"?\")[:10]} {tx.get(\"chain\")}: {tx.get(\"amount_native\")} ({tx.get(\"amount_usd\", 0):.2f} USD)\\n'
          except: revenue_summary = '(revenue_ledger.json not found)'

          report = f'''# Weekly Report — {datetime.now(timezone.utc).strftime(\"%Y-%m-%d\")}

          ## Summary

          This is an automated weekly summary of the Zero-Cost AI Business Agent v4.

          ## Revenue (verified on-chain)

          {revenue_summary}

          ## Budget Usage

          {budget_summary}

          ## Recent State

          {state[:2000]}

          ## Active Experiments

          {experiments[-2000:]}

          ## Recent Distribution

          {distribution[-1000:]}

          ## Analytics (last entries)

          {analytics[-1500:]}

          ## Action Log (last 1000 chars)

          {action_log[-1000:]}

          ---
          Generated by .github/workflows/weekly-report.yml
          '''

          # Write to GITHUB_OUTPUT for the issue body
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              # Multi-line value trick
              escaped = report.replace('\\n', '%0A').replace('\\r', '%0D')
              f.write(f'REPORT<<EOF\n{report}\nEOF\n')
          "
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create issue with weekly report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const report = process.env.REPORT || '(report generation failed)';
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Report — ${date}`,
              body: report,
              labels: ['weekly-report']
            });
        env:
          REPORT: ${{ env.REPORT }}
