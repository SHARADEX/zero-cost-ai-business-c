name: First-Run Bootstrap (v4.1)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bootstrap (auto-configure placeholders)
        run: python3 bootstrap.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}

      - name: Run monetization injection on all pages
        run: |
          python3 -c "
          import sys, os, glob
          sys.path.insert(0, '.')
          import monetization
          # Inject monetization (ad zone, newsletter, affiliate) into every HTML page
          changed = 0
          for path in glob.glob('docs/**/*.html', recursive=True):
              success, msg = monetization.inject_into_file(path)
              if success and 'No changes' not in msg:
                  print(f'  {msg}')
                  changed += 1
          print(f'\\nMonetization injected into {changed} pages')
          "

      - name: Regenerate sitemap and robots.txt
        run: |
          python3 -c "
          import sys, os
          sys.path.insert(0, '.')
          import seo
          count = seo.regenerate_sitemap()
          seo.regenerate_robots()
          print(f'Regenerated sitemap with {count} pages')
          "

      - name: Commit bootstrap changes
        run: |
          git config --local user.email "bootstrap@ai-business-v4.local"
          git config --local user.name "Bootstrap Bot v4.1"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes needed"
          else
            git commit -m "Bootstrap: auto-configured placeholders, monetization, sitemap"
            for i in 1 2 3; do
              if git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}; then
                echo "Push succeeded on attempt $i"
                break
              else
                echo "Push failed on attempt $i, retrying in 5s..."
                sleep 5
              fi
            done
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        continue-on-error: true

      - name: Create first-run issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Agent v4.1 is live — first run complete`,
              body: `# Welcome to Zero-Cost AI Business v4.1

            Your autonomous agent is now running. Here's what happened on first run:

            ## Auto-configured (zero operator action needed)

            - ✅ Detected GitHub repo: \`${context.repo.owner}/${context.repo.repo}\`
            - ✅ Derived site URL: \`https://${context.repo.owner}.github.io/${context.repo.repo}\`
            - ✅ Replaced all placeholders (\`testuser\`, \`my-tools-repo\`, etc.) in every file
            - ✅ Injected monetization into all pages (ad zone, newsletter, affiliate)
            - ✅ Regenerated sitemap.xml and robots.txt
            - ✅ Agent will run every 30 minutes via \`loop.yml\`

            ## Active revenue streams (working from day 1)

            | Stream | Status | How it works |
            |--------|--------|--------------|
            | Programmatic SEO | ✅ Active | 42+ pages live, agent adds more each run |
            | House ads | ✅ Active (fallback) | Cross-promotes other tools on every page |
            | Affiliate links | ✅ Active (fallback) | Shows "Recommended Services" without commission codes |
            | Crypto tips | ⚠️ Needs your wallet | Replace placeholder wallet addresses |
            | GitHub Sponsors / BMC | ⚠️ Optional | Add your usernames when ready |
            | Newsletter | ✅ Active (mailto fallback) | Uses your GitHub email by default |
            | Sponsored placements | ⏸ Future | Activates after traffic builds |

            ## Optional upgrades (do these when you have time)

            1. **Replace wallet addresses** in \`docs/guides/crypto-tips.html\` and \`memory/revenue.md\`
               with your own. Until then, tips go to the original author.

            2. **Sign up for EthicalAds or Carbon Ads** (free ad network):
               - https://ethicalads.io (easier approval)
               - https://carbonads.net (higher RPM)
               - Then set the secret \`ETHICALADS_PUBLISHER_ID\` or \`CARBON_ADS_ID\`
               - The agent will auto-upgrade from house ads to paid ads

            3. **Register for affiliate programs**:
               - DigitalOcean, Vultr, Notion, etc.
               - Add your referral URLs to \`memory/affiliate_links.md\`
               - The agent will auto-inject them into relevant pages

            4. **Sign up for GoatCounter** (free, page-level analytics):
               - https://goatcounter.com
               - Set \`GC_API_TOKEN\` and \`GC_SITE_ID\` secrets
               - Until then, the agent uses GitHub Traffic API (zero-setup)

            5. **Sign up for Buttondown** (free newsletter):
               - https://buttondown.com
               - Set \`BUTTONDOWN_SLUG\` secret
               - Until then, the agent uses a mailto: link

            ## Monitoring

            - **Every run**: check the Actions tab
            - **Weekly**: a new GitHub issue will auto-open every Monday with a summary
            - **Daily**: check \`memory/state.md\` for run summaries
            - **Hourly**: \`health-check.yml\` verifies the site is up

            ## Stop the agent

            Any of:
            - Create a file named \`PAUSE\` in the repo root
            - Set the secret \`PAUSE_AGENT=true\`
            - Open a GitHub issue labeled \`agent-pause\`

            ## Next steps

            The agent will handle everything else. Just monitor the weekly reports.
            `,
              labels: ['first-run', 'welcome']
            });
